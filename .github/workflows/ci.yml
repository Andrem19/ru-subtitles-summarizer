name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: extension/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: No leftover branding or credentials in sources
        working-directory: .
        run: |
          # Guard against re-introducing a site-specific default or a pasted key:
          # the extension ships to strangers and must stay vendor-neutral.
          # This workflow file itself is excluded — it holds the very patterns it
          # searches for, and would otherwise always match.
          if git grep -nIE 'abertay|mylearningspace|sk-[A-Za-z0-9]{16,}|gsk_[A-Za-z0-9]{16,}|x-api-key: [A-Za-z0-9]' \
               -- . ':!CHANGELOG.md' ':!.github/workflows/ci.yml'; then
            echo "::error::found a site-specific default or a credential-looking string in tracked files"
            exit 1
          fi
          echo "sources are clean"

      - name: Verify the built bundle is free of them too
        run: |
          if grep -rlIE 'abertay|mylearningspace' dist; then
            echo "::error::the built bundle is stale — rebuild before publishing"
            exit 1
          fi
          echo "bundle is clean"

      - name: Verify the built manifest
        run: |
          node -e '
            const m = require("./dist/manifest.json");
            const ok = m.manifest_version === 3 && m.host_permissions.includes("<all_urls>");
            if (!ok) { console.error("unexpected built manifest", m); process.exit(1); }
            console.log("manifest", m.version, "ok");
          '

      - name: Upload the built extension
        uses: actions/upload-artifact@v4
        with:
          name: ru-subtitles-dist
          path: extension/dist
